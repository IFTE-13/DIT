<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="ditGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9d4d"/>
      <stop offset="100%" stop-color="#ff751a"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1e24"/>
      <stop offset="100%" stop-color="#0a0a0d"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Base Rounded Container with subtle border -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bgGrad)" stroke="#ff8b38" stroke-width="2.5" stroke-opacity="0.9" />

  <!-- DIT Monogram typography -->
  <g filter="url(#glow)">
    <text x="31" y="42" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-weight="900" font-size="24" letter-spacing="-0.5" text-anchor="middle">
      <tspan fill="#ffffff">D</tspan><tspan fill="url(#ditGrad)">IT</tspan>
    </text>
  </g>

  <!-- Accent top dot -->
  <circle cx="51" cy="20" r="3.2" fill="url(#ditGrad)"/>
</svg>
